name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify tag and source versions
        run: node scripts/release.mjs check "${GITHUB_REF_NAME#v}"

      - name: Test
        run: npm test

      - name: Build release archives
        run: npm run release:package

      - name: Verify committed bundle stayed unchanged
        run: git diff --exit-code -- skills/process-model-generator/scripts/process-model-generator.mjs

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload verified release artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: |
            dist/process-model-generator-skill-*.zip
            dist/process-model-generator-plugin-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: dist

      - name: Verify downloaded release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/process-model-generator-skill-*.zip
            dist/process-model-generator-plugin-*.zip
            dist/SHA256SUMS
